name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# one build per branch/PR; a newer push cancels the running one
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    # fast checks of the ucode backend (updater) without a firmware build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake libjson-c-dev u-boot-tools curl python3
      - name: Fetch buildroot (for pinned libubox version)
        run: make buildroot
      - name: Build ucode for the host (same commits as the firmware)
        run: tests/build-host-ucode.sh "$HOME/hostroot"
      - name: Updater tests
        run: LD_LIBRARY_PATH="$HOME/hostroot/lib" tests/test-update.sh "$HOME/hostroot/bin/ucode"
      - name: Network tests
        run: LD_LIBRARY_PATH="$HOME/hostroot/lib" tests/test-net.sh "$HOME/hostroot/bin/uci"
      - name: Model descriptions (board.sh, LEDs, fan backends)
        run: tests/test-boards.sh
      - name: Size check of the flash partition in shareos-install-ubi
        run: tests/test-install-ubi.sh
      - name: Button tests (reset/USB)
        run: LD_LIBRARY_PATH="$HOME/hostroot/lib" tests/test-buttons.sh "$HOME/hostroot/bin"
      - name: Notification tests
        run: LD_LIBRARY_PATH="$HOME/hostroot/lib" tests/test-notify.sh "$HOME/hostroot/bin"
      - name: RAID members that come up late at boot
        run: tests/test-raid-wait.sh
      - name: Start snapshots (shareos-bootlog)
        run: tests/test-bootlog.sh
      - name: Power schedule (shareos-power)
        run: LD_LIBRARY_PATH="$HOME/hostroot/lib" tests/test-power.sh "$HOME/hostroot/bin"
      - name: Zabbix agent controller (settings, disk/RAID items)
        run: LD_LIBRARY_PATH="$HOME/hostroot/lib" tests/test-zabbix-items.sh "$HOME/hostroot/bin"
      - name: SMART evaluation (disk health)
        run: LD_LIBRARY_PATH="$HOME/hostroot/lib" tests/test-smart.sh "$HOME/hostroot/bin/ucode"
      - name: rpcd plugin compiles, no forward references
        run: |
          tests/check-ucode-order.py src/shareos-core/usr/share/rpcd/ucode/shareos.uc
          tests/check-ucode-order.py src/shareos-core/usr/sbin/shareos-apps
          tests/check-ucode-order.py src/shareos-core/usr/sbin/shareos-notify
          tests/check-ucode-regex.py
          tests/check-acl.py
          tests/check-i18n.py
          node tests/check-i18n-coverage.js
          LD_LIBRARY_PATH="$HOME/hostroot/lib" "$HOME/hostroot/bin/ucode" -c -o /tmp/apps.ucc src/shareos-core/usr/sbin/shareos-apps
          LD_LIBRARY_PATH="$HOME/hostroot/lib" "$HOME/hostroot/bin/ucode" -c -o /tmp/shareos.ucc src/shareos-core/usr/share/rpcd/ucode/shareos.uc

  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        board: [dns320l]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # version.sh uses git describe

      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex cpio rsync unzip file wget \
            libssl-dev libncurses-dev python3

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: dl-${{ hashFiles('configs/*_defconfig', 'Makefile', 'patches/**/*.hash') }}
          restore-keys: dl-

      - name: Build ${{ matrix.board }}
        run: make ${{ matrix.board }}

      - name: Test writing .bin files (rollback to Alt-F)
        run: tests/test-flash-bin.sh output/${{ matrix.board }}/host/bin

      - name: Initramfs load address of every model
        run: tests/check-initrd-address.sh output/${{ matrix.board }}/images

      - name: Build system apps (nano, htop … as .sapp, with this toolchain)
        if: matrix.board == 'dns320l'
        run: make sysapps-pack

      - name: Collect images
        run: |
          mkdir -p artifacts
          cp output/${{ matrix.board }}/images/ShareOS-*.bin* output/${{ matrix.board }}/images/ShareOS-*.sha1 output/${{ matrix.board }}/images/ShareOS-*.sysupgrade.tar* artifacts/
          if [ -d output/sysapps/sapp ]; then cp output/sysapps/sapp/*.sapp output/sysapps/sapp/*.sapp.sha256 artifacts/; fi
          ls -l artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: shareos-${{ matrix.board }}
          path: artifacts/

      - name: Release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=${GITHUB_REF_NAME#v}
          awk -v v="$v" '$0 ~ "^## " {p = ($2 == v)} p' CHANGELOG.md | tail -n +2 > notes.md
          if [ -s notes.md ]; then
            { echo; echo "---"; echo; cat notes.md; } > notes.tmp && mv notes.tmp notes.md
          else
            echo "::warning::CHANGELOG.md has no section '## $v' – please add the changes of this release"
          fi

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: notes.md
          append_body: true
