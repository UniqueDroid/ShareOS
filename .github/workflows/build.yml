name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# one build per branch/PR; a newer push cancels the running one
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    # ShellCheck (errors), ESLint and unused code of the web interface –
    # nothing is run; see tests/static-analysis.sh. CodeQL: codeql.yml
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: ShellCheck, ESLint, dead code
        run: tests/static-analysis.sh
      - name: Report (warnings and complexity, informational)
        if: always()
        run: tests/static-analysis.sh --report > static-analysis-report.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-analysis-report
          path: static-analysis-report.txt

  backend-tests:
    # fast checks of the ucode backend (updater) without a firmware build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake libjson-c-dev u-boot-tools curl python3
      - name: Fetch buildroot (for pinned libubox version)
        run: make buildroot
      - name: Build ucode for the host (same commits as the firmware)
        run: tests/build-host-ucode.sh "$HOME/hostroot"
      - name: Updater tests
        run: LD_LIBRARY_PATH="$HOME/hostroot/lib" tests/test-update.sh "$HOME/hostroot/bin/ucode"
      - name: Network tests
        run: LD_LIBRARY_PATH="$HOME/hostroot/lib" tests/test-net.sh "$HOME/hostroot/bin/uci"
      - name: Model descriptions (board.sh, LEDs, fan backends)
        run: tests/test-boards.sh
      - name: Disk change wizard (shareos-migrate with two folders as drives)
        run: LD_LIBRARY_PATH="$HOME/hostroot/lib" tests/test-migrate.sh "$HOME/hostroot/bin/uci"
      - name: Rescue mode (SSH only after the USB button)
        run: tests/test-rescue.sh
      - name: Size check of the flash partition in shareos-install-ubi
        run: tests/test-install-ubi.sh
      - name: Button tests (reset/USB)
        run: LD_LIBRARY_PATH="$HOME/hostroot/lib" tests/test-buttons.sh "$HOME/hostroot/bin"
      - name: Notification tests
        run: LD_LIBRARY_PATH="$HOME/hostroot/lib" tests/test-notify.sh "$HOME/hostroot/bin"
      - name: RAID members that come up late at boot
        run: tests/test-raid-wait.sh
      - name: Start snapshots (shareos-bootlog)
        run: tests/test-bootlog.sh
      - name: Power schedule (shareos-power)
        run: LD_LIBRARY_PATH="$HOME/hostroot/lib" tests/test-power.sh "$HOME/hostroot/bin"
      - name: Printers (shareos-printer with a fake /sys, ipp-usb and p910nd)
        run: LD_LIBRARY_PATH="$HOME/hostroot/lib" tests/test-printer.sh "$HOME/hostroot/bin"
      - name: UPS (shareos-ups with fake NUT programs)
        run: LD_LIBRARY_PATH="$HOME/hostroot/lib" tests/test-ups.sh "$HOME/hostroot/bin"
      - name: DNS-320 rev A temperature (answer of the MCU, shareos-board)
        run: tests/test-mcu-temp.sh
      - name: Wake-up alarm of the MCU (year of the alarm, reading does not switch it)
        run: tests/test-mcu-alarm.sh
      - name: DNS-1200-05 microcontroller (dns1200-mcu against a simulated one)
        run: tests/test-dns1200-mcu.sh
      - name: Background file jobs of the plugin (progress of a copy, stopping it)
        run: LD_LIBRARY_PATH="$HOME/hostroot/lib" tests/test-file-jobs.sh "$HOME/hostroot/bin"
      - name: Dynamic DNS (shareos-ddns, all providers with a fake curl)
        run: LD_LIBRARY_PATH="$HOME/hostroot/lib" tests/test-ddns.sh "$HOME/hostroot/bin"
      - name: Zabbix agent controller (settings, disk/RAID items)
        run: LD_LIBRARY_PATH="$HOME/hostroot/lib" tests/test-zabbix-items.sh "$HOME/hostroot/bin"
      - name: SMART evaluation (disk health)
        run: LD_LIBRARY_PATH="$HOME/hostroot/lib" tests/test-smart.sh "$HOME/hostroot/bin/ucode"
      - name: rpcd plugin compiles, no forward references
        run: |
          tests/check-ucode-order.py src/shareos-core/usr/share/rpcd/ucode/shareos.uc
          tests/check-ucode-order.py src/shareos-core/usr/sbin/shareos-apps
          tests/check-ucode-order.py src/shareos-core/usr/sbin/shareos-notify
          tests/check-ucode-order.py src/shareos-core/usr/sbin/shareos-ddns
          tests/check-ucode-regex.py
          tests/check-acl.py
          tests/check-i18n.py
          node tests/check-i18n-coverage.js
          LD_LIBRARY_PATH="$HOME/hostroot/lib" "$HOME/hostroot/bin/ucode" -c -o /tmp/apps.ucc src/shareos-core/usr/sbin/shareos-apps
          src/shareos-core/build-parts.sh
          LD_LIBRARY_PATH="$HOME/hostroot/lib" "$HOME/hostroot/bin/ucode" -c -o /tmp/shareos.ucc src/shareos-core/usr/share/rpcd/ucode/shareos.uc

  firmware:
    # the name of the check as before the matrix had more than the board
    name: firmware (${{ matrix.board }})
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        # dns320l: the Kirkwood boxes, published with a release (artifact
        #   "shareos-…", the only ones the job "release" takes).
        # octeon: the Cavium OCTEON boxes (DNS-1200-05) that are being added –
        #   devtest images, kept as the artifact "devtest-octeon", never released.
        include:
          - board: dns320l
            qemu: qemu-arm-static
            artifact: shareos-dns320l
          - board: octeon
            qemu: qemu-mips64-static
            artifact: devtest-octeon
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # version.sh uses git describe

      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex cpio rsync unzip file wget \
            libssl-dev libncurses-dev python3 qemu-user-static

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: dl-${{ hashFiles('configs/*_defconfig', 'Makefile', 'patches/**/*.hash') }}
          restore-keys: dl-

      - name: Build ${{ matrix.board }}
        run: make ${{ matrix.board }}

      - name: Test writing .bin files (rollback to Alt-F)
        if: matrix.board == 'dns320l'
        run: tests/test-flash-bin.sh output/${{ matrix.board }}/host/bin

      - name: Own certificate authority (shareos-ca with the firmware's mbedtls and uci in qemu)
        run: |
          T=$PWD/output/${{ matrix.board }}/target W=$(mktemp -d)
          for p in gen_key cert_write cert_app pk_verify uci; do
            f=$T/usr/bin/$p; [ -e "$f" ] || f=$T/sbin/$p
            printf '#!/bin/sh\nexec ${{ matrix.qemu }} -L %s %s "$@"\n' "$T" "$f" > $W/$p; chmod 755 $W/$p
          done
          tests/test-ca.sh $W $W
          # signed releases: the box's pk_verify takes what the release job signs
          tests/test-signature.sh $W/pk_verify

      - name: Initramfs load address of every model
        if: matrix.board == 'dns320l'
        run: tests/check-initrd-address.sh output/${{ matrix.board }}/images

      - name: Build system apps (nano, htop … as .sapp, with this toolchain)
        if: matrix.board == 'dns320l'
        run: make sysapps-pack

      - name: Collect images
        if: matrix.board == 'dns320l'
        run: |
          mkdir -p artifacts
          cp output/${{ matrix.board }}/images/ShareOS-*.bin* output/${{ matrix.board }}/images/ShareOS-*.sha1 output/${{ matrix.board }}/images/ShareOS-*.sysupgrade.tar* artifacts/
          if [ -d output/sysapps/sapp ]; then cp output/sysapps/sapp/*.sapp output/sysapps/sapp/*.sapp.sha256 artifacts/; fi
          ls -l artifacts

      # a platform that is being added: an ELF file for the box's U-Boot and
      # the same in a uImage wrapper, all named …-devtest (post-image.sh)
      - name: Collect devtest images
        if: matrix.board != 'dns320l'
        run: |
          mkdir -p artifacts
          cp output/${{ matrix.board }}/images/ShareOS-*-devtest.* artifacts/
          (cd artifacts && sha256sum -c ./*.sha256)
          file artifacts/*.elf
          if ls artifacts | grep -v -e '-devtest\.' ; then
            echo "::error::files without -devtest in the name in a devtest artifact"; exit 1
          fi
          ls -l artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/

      # The built system (ARM) in a chroot with qemu-user: rpcd with the ShareOS
      # plugin, users, storage, apps, cloud … – what the host tests cannot
      # show. Last step: the images are uploaded (and the job "release"
      # publishes them) also when one of these tests fails.
      - name: ARM emulator tests (the built system with qemu-user)
        if: matrix.board == 'dns320l'
        run: |
          sudo apt-get install -y --no-install-recommends qemu-user-static binfmt-support
          # the fake Tuya device of test-sysperms (without it those checks are
          # skipped); fixed version, only for this step – the images are uploaded
          sudo pip3 install --break-system-packages -q tinytuya==1.21.1 ||
            echo "::warning::tinytuya not installed – the Tuya checks of test-sysperms are skipped"
          O=output/${{ matrix.board }}
          v=$(sed -n 's/^VERSION=${SHAREOS_RCLONE_VERSION:-\(.*\)}$/\1/p' src/shareos-core/usr/sbin/shareos-cloud)
          mkdir -p "rclone-dl/v$v"
          for f in "rclone-v$v-linux-arm.zip" SHA256SUMS; do
            curl -fsSL --retry 3 -o "rclone-dl/v$v/$f" "https://github.com/rclone/rclone/releases/download/v$v/$f"
          done
          # RAID layouts of test-storage need the md personalities of this machine
          sudo modprobe -a raid0 raid1 linear 2>/dev/null || true
          # AdGuard Home of test-dnsfilter binds port 53 of this machine: free it
          # (names are then resolved by the servers systemd-resolved had found)
          sudo systemctl stop systemd-resolved
          sudo ln -sf /run/systemd/resolve/resolv.conf /etc/resolv.conf
          # The box has one network interface, eth0, and the firmware asks it
          # for its address (certificate, mDNS, DNS filter). Machines whose
          # interface has another name get an eth0 with an address for the tests.
          if ! ip -4 -o addr show dev eth0 2>/dev/null | grep -q inet; then
            echo "no eth0 with an IPv4 address on this machine:"; ip -4 -o addr; ip route
            sudo ip link add eth0 type dummy 2>/dev/null || true
            sudo ip link set eth0 up multicast on
            sudo ip addr add 192.0.2.20/24 dev eth0
            ip -4 -o addr show dev eth0
          fi
          rc=0
          run() { echo "::group::$1"; shift; if sudo "$@"; then echo "::endgroup::"; else echo "::endgroup::"; echo "::error::failed: $*"; rc=1; fi; }
          run "stack (rpcd, uhttpd, JSON-RPC)" tests/run-stack-qemu.sh "$O" 8080 --check
          for t in users storage apps firstinstall transmission media dlna vpn tailscale autobrr syncthing zabbix snapshots sysperms; do
            run "test-$t" "tests/test-$t.sh" "$O"
          done
          # AdGuard Home under the emulator starts and restarts too irregularly
          # on these machines (other checks fail in every run): its result is
          # shown as a warning and does not decide the job
          echo "::group::test-dnsfilter (does not decide the job)"
          sudo tests/test-dnsfilter.sh "$O" || echo "::warning::test-dnsfilter failed (AdGuard Home under the emulator; see the log)"
          echo "::endgroup::"
          run "test-cloud-paperless" tests/test-cloud-paperless.sh "$O" "$PWD/rclone-dl"
          exit $rc

  # A tag "v…": sign the images and publish the release. Its own job because
  # of the key: RELEASE_SIGNING_KEY is a secret of the environment "release",
  # which only this job may use – the build above also runs for pull requests
  # and never sees it. The boxes check the signature against
  # src/shareos-core/etc/shareos/release.pub (shareos-update).
  release:
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    needs: firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    steps:
      - uses: actions/checkout@v5

      # only "shareos-…": the devtest images of a platform that is being
      # added ("devtest-…") are not part of a release
      - uses: actions/download-artifact@v4
        with:
          pattern: shareos-*
          path: artifacts
          merge-multiple: true

      # a model that is being added (status "devtest" in post-image.sh) keeps
      # the root password "shareos" – its files never go into a release
      - name: No devtest images
        run: |
          if ls artifacts/*-devtest.* >/dev/null 2>&1; then
            echo "::error::devtest images in the build: $(cd artifacts && ls *-devtest.* | tr '\n' ' ') – set the model to 'release' in board/dlink/dns320l/post-image.sh and BOARD_DEVTEST=0 in board.sh when it is tested, or take it out"
            exit 1
          fi

      - name: Sign the images
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          pub=src/shareos-core/etc/shareos/release.pub
          ls artifacts/*.sysupgrade.tar >/dev/null
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            # boxes with the public key install nothing unsigned: no release then
            echo "::error::The secret RELEASE_SIGNING_KEY of the environment 'release' is empty – nothing published (see docs/RELEASE.md)"
            exit 1
          fi
          umask 077
          key=$(mktemp); trap 'rm -f "$key"' EXIT
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key"
          for f in artifacts/*.sysupgrade.tar artifacts/*.bin; do
            [ -e "$f" ] || continue
            openssl dgst -sha256 -sign "$key" -out "$f.sig" "$f"
            # the key must be one the boxes know (release.pub or the reserve)
            openssl dgst -sha256 -verify "$pub" -signature "$f.sig" "$f" >/dev/null 2>&1 ||
              openssl dgst -sha256 -verify "${pub%.pub}-reserve.pub" -signature "$f.sig" "$f" >/dev/null || {
              echo "::error::$f: the signature fits neither $pub nor the reserve key – wrong key in the secret?"; exit 1; }
            echo "signed: $f"
          done
          chmod 644 artifacts/*.sig

      - name: Release notes from CHANGELOG.md
        run: |
          v=${GITHUB_REF_NAME#v}
          awk -v v="$v" '$0 ~ "^## " {p = ($2 == v)} p' CHANGELOG.md | tail -n +2 > notes.md
          if [ -s notes.md ]; then
            { echo; echo "---"; echo; cat notes.md; } > notes.tmp && mv notes.tmp notes.md
          else
            echo "::warning::CHANGELOG.md has no section '## $v' – please add the changes of this release"
          fi

      - name: Publish release
        # not an action of GitHub itself and it runs with the right to publish:
        # pinned to a commit (a tag can be moved), here v2.6.2
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: artifacts/*
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: notes.md
          append_body: true
